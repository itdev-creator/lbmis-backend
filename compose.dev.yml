# Local development services. Start with:
#   docker compose -f compose.dev.yml up -d
# then run the app on your machine with: php artisan serve
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lbmis
      POSTGRES_USER: lbmis
      POSTGRES_PASSWORD: secret
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  mailpit:
    image: axllent/mailpit
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  pgdata:
